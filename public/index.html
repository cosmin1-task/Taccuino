<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taccuino</title>
<!-- Per l'iPhone: icona, nome e aspetto quando e' aggiunto alla schermata Home -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icone/icona-192.png">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taccuino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="stile.css">
</head>
<body>

<header class="testata">
  <div class="testata-riga">
    <h1 class="marchio">Taccuino</h1>
    <div class="cerca-contenitore">
      <input id="cerca" type="search" placeholder="Cerca in tutto: clienti, incarichi, note…" autocomplete="off">
      <button id="cerca-pulisci" class="cerca-pulisci" title="Pulisci ricerca" hidden>&times;</button>
    </div>
    <span id="stato-salvataggio" class="stato-salvataggio" aria-live="polite"></span>
  </div>
  <nav class="schede" role="tablist">
    <button class="scheda attiva" data-vista="incarichi" role="tab">Incarichi <span class="conteggio" id="conteggio-incarichi"></span></button>
    <button class="scheda" data-vista="clienti" role="tab">Clienti <span class="conteggio" id="conteggio-clienti"></span></button>
    <button class="scheda" data-vista="note" role="tab">Note <span class="conteggio" id="conteggio-note"></span></button>
    <button class="scheda" data-vista="copia" role="tab"><span class="lungo">Copia di sicurezza</span><span class="corto">Copia</span></button>
  </nav>
</header>

<main>

  <!-- Sull'iPhone, aperto in Safari: come installarlo -->
  <div id="installa" class="riquadro suggerimento" hidden></div>
  <!-- Sull'iPhone: promemoria se manca una copia di sicurezza recente -->
  <div id="promemoria-copia" class="promemoria-copia" hidden></div>

  <!-- RISULTATI DI RICERCA -->
  <section id="vista-ricerca" class="vista" hidden>
    <h2 class="titolo-vista">Risultati per “<span id="ricerca-termine"></span>”</h2>
    <div id="ricerca-risultati"></div>
  </section>

  <!-- INCARICHI -->
  <section id="vista-incarichi" class="vista">
    <form id="form-incarico" class="riquadro aggiunta">
      <input name="titolo" placeholder="Cosa devi fare?" required maxlength="300" class="campo-largo">
      <select name="clienteId" class="campo-cliente"><option value="">— nessun cliente —</option></select>
      <select name="livello" class="campo-livello" title="Quanto e' urgente"></select>
      <label class="campo-data" title="Da quando contano i giorni. Vuoto = oggi">Da <input name="dataInizio" type="date"></label>
      <label class="campo-data" title="Entro quando va fatto. Facoltativa">Entro <input name="scadenza" type="date"></label>
      <button type="submit" class="bottone-primario">Aggiungi</button>
    </form>

    <div class="filtri">
      <button class="filtro attivo" data-stato="aperti">Da fare e in corso</button>
      <button class="filtro" data-stato="da fare">Da fare</button>
      <button class="filtro" data-stato="in corso">In corso</button>
      <button class="filtro" data-stato="fatto">Fatti</button>
      <button class="filtro" data-stato="tutti">Tutti</button>
      <button class="filtro filtro-urgenti" data-stato="urgenti">Solo urgenti</button>
    </div>

    <div id="elenco-incarichi"></div>
  </section>

  <!-- CLIENTI -->
  <section id="vista-clienti" class="vista" hidden>
    <form id="form-cliente" class="riquadro aggiunta">
      <input name="nome" placeholder="Nome cliente" required maxlength="200" class="campo-largo">
      <input name="contatto" placeholder="Contatto (mail, telefono…)" maxlength="300">
      <button type="submit" class="bottone-primario">Aggiungi</button>
    </form>
    <div id="elenco-clienti"></div>
  </section>

  <!-- NOTE -->
  <section id="vista-note" class="vista" hidden>
    <form id="form-nota" class="riquadro aggiunta aggiunta-nota">
      <textarea name="testo" placeholder="Scrivi una nota… (Cmd+Invio per salvare)" required maxlength="50000" rows="3"></textarea>
      <div class="riga-nota">
        <select name="clienteId" class="campo-cliente"><option value="">— nessun cliente —</option></select>
        <select name="incaricoId" class="campo-cliente"><option value="">— nessun incarico —</option></select>
        <button type="submit" class="bottone-primario">Salva nota</button>
      </div>
    </form>
    <div id="elenco-note"></div>
  </section>

  <!-- COPIA DI SICUREZZA -->
  <section id="vista-copia" class="vista" hidden>
    <div class="riquadro pannello">
      <h2 class="titolo-pannello">Copia di sicurezza</h2>
      <p id="dove-sono-i-dati" class="spiegazione"></p>
      <div class="riga-nota">
        <button type="button" id="salva-copia" class="bottone-primario bottone-in-linea">Salva una copia</button>
        <button type="button" id="carica-copia" class="bottone-leggero">Carica una copia</button>
        <input type="file" id="file-copia" accept=".json,application/json" hidden>
      </div>
      <p id="ultima-copia" class="spiegazione piccola"></p>
    </div>
  </section>

</main>

<div id="avviso" class="avviso" hidden></div>

<script src="livelli.js"></script>
<script src="archivio.js"></script>
<script src="memoria.js"></script>
<script src="app.js"></script>
</body>
</html>
